services:
  asm:
    build: .
    platform: linux/amd64
    container_name: rain
    volumes:
      - .:/root/painworld
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
    working_dir: /root/painworld
    environment:
      - TERM=xterm-256color
    command: /bin/bash
